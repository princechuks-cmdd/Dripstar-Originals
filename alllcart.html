<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dripstar Originals - My Bag</title>
  <style>
    * { box-sizing: border-box; }
    body { background-color: black; font-family: 'Segoe UI', sans-serif; color: white; padding: 10px; margin: 0; font-size: 15px; }
    .cart-container { width: 100%; max-width: 800px; margin: 10px auto; background: #111; padding: 15px; border-radius: 16px; border: 1px solid #333; box-shadow: 0 10px 40px rgba(0,0,0,0.5); }
    
    h1 { 
      color: aliceblue; 
      border-bottom: 2px solid #b8860b; 
      padding-bottom: 12px; 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      margin-top: 0; 
      font-size: 1.3rem; 
      flex-wrap: wrap; 
      gap: 10px; 
    }  
    
    .cart-item { 
      display: flex; 
      align-items: center; 
      justify-content: space-between; 
      padding: 12px 0; 
      border-bottom: 1px solid #222; 
      gap: 12px; 
    }
    
    .item-left { 
      display: flex; 
      align-items: center; 
      gap: 12px; 
      flex: 1; 
      min-width: 0; 
    }
    
    .item-img { 
      width: 60px; 
      height: 60px; 
      object-fit: cover; 
      border-radius: 10px; 
      border: 1px solid #333; 
      flex-shrink: 0; 
    }
    
    .item-info { 
      flex: 1; 
      min-width: 0; 
    }
    
    .item-info h3 { 
      margin: 0 0 6px 0; 
      color: #b8860b; 
      font-size: 1rem; 
      white-space: nowrap; 
      overflow: hidden; 
      text-overflow: ellipsis; 
    }
    
    .edit-controls { 
      display: flex; 
      gap: 8px; 
      align-items: center; 
      margin-bottom: 6px; 
      flex-wrap: wrap; 
    }
    
    .edit-group { 
      display: flex; 
      flex-direction: column; 
      gap: 2px; 
    }
    
    .edit-group label { 
      font-size: 0.7rem; 
      color: #888; 
      text-transform: uppercase; 
      letter-spacing: 0.5px; 
    }
    
    .cart-select, .cart-qty { 
      background: #000; 
      color: white; 
      border: 1px solid #444; 
      padding: 4px 8px; 
      border-radius: 6px; 
      outline: none; 
      cursor: pointer; 
      transition: 0.3s; 
      font-size: 0.85rem;
    }
    
    .cart-select:focus, .cart-qty:focus { border-color: #ff00cc; }
    .cart-qty { width: 50px; text-align: center; }

    .btn-remove { 
      color: #ff4444; 
      background: none; 
      border: none; 
      cursor: pointer; 
      text-decoration: underline; 
      font-size: 0.8rem; 
      padding: 0; 
      margin-top: 2px; 
      transition: 0.3s; 
    }
    .btn-remove:hover { color: white; }

    .item-price { 
      font-weight: bold; 
      font-size: 1rem; 
      text-align: right; 
      color: #fff; 
      white-space: nowrap; 
      flex-shrink: 0; 
    }
    
    /* --- SUMMARY AREA --- */
    .summary-box { margin-top: 15px; text-align: right; }
    .total-row { font-size: 1.3rem; font-weight: bold; margin: 12px 0; color: white; border-top: 1px solid #333; padding-top: 12px; }
    
    .btn-checkout { 
      width: 100%; 
      background: linear-gradient(45deg, #ff00cc, #3333ff); 
      color: white; padding: 12px; border: none; border-radius: 25px; 
      font-weight: bold; font-size: 1rem; cursor: pointer; 
      transition: transform 0.3s, filter 0.3s; 
    }
    .btn-checkout:hover { transform: scale(1.02); filter: brightness(1.1); }
    
    .btn-shop { display: block; text-align: center; color: #888; text-decoration: none; margin-top: 12px; font-size: 0.9rem; transition: 0.3s; }
    .btn-shop:hover { color: #b8860b; }
    
    .currency-picker { background: #222; color: #b8860b; border: 1px solid #b8860b; border-radius: 8px; padding: 4px 8px; font-size: 0.8rem; cursor: pointer; }
    
    .promo-section { margin-top: 15px; padding: 10px; background: rgba(255,255,255,0.03); border-radius: 12px; border: 1px dashed #444; display: flex; gap: 8px; align-items: center; }
    .promo-input { flex: 1; min-width: 0; padding: 8px 12px; border-radius: 18px; border: 1px solid #333; background: #000; color: white; font-size: 0.9rem; }
    .btn-apply { background: #b8860b; color: white; border: none; padding: 8px 16px; border-radius: 18px; cursor: pointer; font-weight: bold; transition: 0.3s; font-size: 0.9rem; flex-shrink: 0; }
    .btn-apply:hover { background: #daa520; }
    
    .privacybtn {
      display: flex;
      flex-direction: row;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 15px;
      margin: 20px auto;
      max-width: 400px;
      padding: 12px;
      background: white;
      color: black;
      border-radius: 25px;
      font-weight: 700;
      letter-spacing: 0.5px;
      transition: 0.3s;
      text-align: center;
      box-shadow: 0 4px 15px rgba(255,255,255,0.1);
    }

    .privacybtn a {
      color: black;
      text-decoration: none;
      transition: 0.3s;
      font-size: 0.85rem;
    }

    .privacybtn a:hover {
      color: #ff00cc;
      transform: scale(1.05);
    }

    @media (max-width: 400px) {
      body { padding: 5px; }
      .cart-container { padding: 10px; }
      .item-img { width: 50px; height: 50px; }
      .cart-item { align-items: flex-start; }
      .item-price { font-size: 0.95rem; }
    }
  </style>
</head>
<body onload="loadCart()">

  <div class="cart-container">
    <h1>
      Your Drip Cart
      <select id="cur" class="currency-picker" onchange="localStorage.setItem('prefCurrency', this.value); loadCart();">
        <option value="USD">USD ($)</option>
        <option value="NGN">NGN (₦)</option>
      </select>
    </h1>

    <div id="items-list"></div>

    <div id="summary-area" style="display: none;">
        <div class="promo-section">
            <input type="text" id="coupon" class="promo-input" placeholder="Promo Code (DRIP10)">
            <button class="btn-apply" onclick="applyDisc()">Apply</button>
        </div>
        <p id="disc-msg" style="font-size:0.8rem; text-align:left; padding-left:5px; margin-top:6px;"></p>
        <div class="summary-box">
            <div style="font-size: 0.95rem; color: #888;">Subtotal: <span id="sub-total-display"></span></div>
            <div id="disc-line" style="display:none; color:#ff00cc; margin-top:4px;">Discount (10%): <span id="disc-amt-display"></span></div>
            <div class="total-row">Total: <span id="final-total"></span></div>
            <button class="btn-checkout" onclick="goToPayment()">Checkout Now</button>
            <a href="shop.html" class="btn-shop">← Back to Shop</a>
        </div>
    </div>

    <div id="empty-bag" style="display:none; text-align:center; padding:30px 10px;">
        <p style="font-size: 1rem; color: #666;">Your bag is currently empty.</p>
        <a href="shop.html" class="btn-checkout" style="display:inline-block; margin-top:12px; text-decoration:none; width: auto; padding: 10px 25px;">Go To Shop</a>
    </div>
  </div>

  <div class="privacybtn">
    <a href="privacypolicy.html">Privacy Policy</a>
    <a href="refundpolicy.html">Refund Policy</a>
  </div>

  <script>
    const NGN_RATE = 1500;
    let isDiscounted = false;

    function formatCurrency(usdAmount) {
      const currentCurrency = localStorage.getItem('prefCurrency') || 'USD';
      if (currentCurrency === 'NGN') {
        return '₦' + (usdAmount * NGN_RATE).toLocaleString(undefined, {minimumFractionDigits: 0});
      }
      return '$' + usdAmount.toFixed(2);
    }

    function loadCart() {
      document.getElementById('cur').value = localStorage.getItem('prefCurrency') || 'USD';
      
      let cart = [];
      try {
        cart = JSON.parse(localStorage.getItem("cart")) || [];
      } catch(e) {
        cart = [];
      }

      const itemsCont = document.getElementById("items-list");
      const summaryArea = document.getElementById("summary-area");
      const emptyArea = document.getElementById("empty-bag");
      
      if (!cart || cart.length === 0) { 
        itemsCont.innerHTML = "";
        summaryArea.style.display = 'none';
        emptyArea.style.display = 'block';
        return; 
      }
      
      emptyArea.style.display = 'none';
      summaryArea.style.display = 'block';
      itemsCont.innerHTML = ""; 
      
      let subtotal = 0;

      cart.forEach((item, index) => {
        const title = item.product || item.name || item.title || item.productName || 'Drip Item';
        const rawPrice = item.price || item.unitPrice || 0;
        const price = parseFloat(typeof rawPrice === 'string' ? rawPrice.replace(/[^0-9.]/g, '') : rawPrice);
        const qty = parseInt(item.quantity || item.qty || item.count || 1);
        const size = item.size || item.productSize || 'M';
        const image = item.image || item.img || item.photo || item.src || '';

        const lineTotal = price * qty;
        subtotal += lineTotal;

        const imageHTML = image ? `<img src="${image}" class="item-img" alt="${title}" onerror="this.style.display='none'">` : '';

        itemsCont.innerHTML += `
          <div class="cart-item">
            <div class="item-left">
              ${imageHTML}
              <div class="item-info">
                <h3>${title}</h3>
                <div class="edit-controls">
                  <div class="edit-group">
                    <label>Size</label>
                    <select class="cart-select" onchange="updateCart(${index}, 'size', this.value)">
                      <option value="S" ${size === 'S' ? 'selected' : ''}>S</option>
                      <option value="M" ${size === 'M' ? 'selected' : ''}>M</option>
                      <option value="L" ${size === 'L' ? 'selected' : ''}>L</option>
                      <option value="XL" ${size === 'XL' ? 'selected' : ''}>XL</option>
                    </select>
                  </div>
                  <div class="edit-group">
                    <label>Qty</label>
                    <input type="number" class="cart-qty" min="1" value="${qty}" 
                           onchange="updateCart(${index}, 'quantity', this.value)">
                  </div>
                </div>
                <button class="btn-remove" onclick="removeItem(${index})">Remove</button>
              </div>
            </div>
            <div class="item-price">${formatCurrency(lineTotal)}</div>
          </div>`;
      });

      document.getElementById("sub-total-display").innerText = formatCurrency(subtotal);
      
      let finalVal = subtotal;
      if (isDiscounted) {
        const discountVal = subtotal * 0.10;
        finalVal = subtotal - discountVal;
        document.getElementById("disc-line").style.display = "block";
        document.getElementById("disc-amt-display").innerText = "-" + formatCurrency(discountVal);
      } else {
        document.getElementById("disc-line").style.display = "none";
      }

      document.getElementById("final-total").innerText = formatCurrency(finalVal);
    }

    function updateCart(index, key, val) {
      let cart = JSON.parse(localStorage.getItem("cart")) || [];
      if (!cart[index]) return;

      if (key === 'quantity') {
        val = parseInt(val);
        if (isNaN(val) || val < 1) val = 1;
        cart[index].quantity = val;
        cart[index].qty = val;
      } else {
        cart[index][key] = val;
      }

      localStorage.setItem("cart", JSON.stringify(cart));
      loadCart();
    }

    function removeItem(index) {
      let cart = JSON.parse(localStorage.getItem("cart")) || [];
      cart.splice(index, 1);
      localStorage.setItem("cart", JSON.stringify(cart));
      loadCart();
    }

    function applyDisc() {
      const code = document.getElementById("coupon").value.trim().toUpperCase();
      const msg = document.getElementById("disc-msg");
      if (code === "DRIP10") {
        isDiscounted = true;
        msg.innerText = "DRIP10 Applied! 10% reduction active. 🔥";
        msg.style.color = "#00ff00";
        loadCart();
      } else {
        alert("Code invalid. Try DRIP10");
      }
    }

    function goToPayment() {
      window.location.href = 'drippayment.html';
    }
  </script>
</body>
</html>
